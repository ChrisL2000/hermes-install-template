# vllm-b70-qwen38 — tuned Qwen3.8-27B (GPTQ INT4 + MTP) on an Intel Arc Pro B70
# Rendered with the variables in ../.env (see .env.example). Do not edit values here;
# change .env and re-run scripts/deploy.sh --skip-build --skip-download.
#
# Profile: Danmoreng's GPTQ rollback flags (minus oneDNN-prefill/W4A8, absent from the base
# image) with gpu-memory-utilization raised to 0.965 after the card was given to vLLM alone.
# Measured 2026-10-12: 82 / 71 / 66 tok/s decode @ 2K / 16K / 64K, KV 241K tokens.
#
# The GPU must be exclusively vLLM's: no ComfyUI / other XPU containers while this runs.

name: ${COMPOSE_PROJECT:-vllm-b70-qwen38-gptq}

services:
  vllm:
    image: ${VLLM_IMAGE:-local/b70-qwen38-vllm:base-dev}
    container_name: ${CONTAINER_NAME:-vllm-b70-qwen38-gptq}
    # the ONLY GPU container that auto-starts at boot
    restart: always
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-992}"
    shm_size: 8gb
    ports:
      - "${HOST_PORT:-8081}:8000"
    networks:
      vllm-network:
        aliases: [vllm-b70]
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - b70-vllm-cache:/root/.cache/vllm
      - b70-triton-cache:/root/.triton/cache
      - ${B70_REPO_DIR}/runtime:/opt/b70-runtime:ro
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_TARGET_DEVICE: xpu
      ZE_FLAT_DEVICE_HIERARCHY: COMPOSITE
      ZE_AFFINITY_MASK: "${ZE_AFFINITY_MASK:-0}"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      B70_XPU_SINGLE_SEED_SAMPLER: "0"
      B70_MTP_BF16_DRAFT: "1"
      B70_DRAFT_LMHEAD_INT4: "1"
      B70_DRAFT_MTP_INT4: "1"
      B70_DRAFT_VOCAB_ENABLED: "0"
      B70_DRAFT_VOCAB_PATH: ""
      VLLM_XPU_ENABLE_XPU_GRAPH: "1"
      PYTORCH_ALLOC_CONF: expandable_segments:True
      PYTHONPATH: /opt/b70-runtime
    command:
      - ${MODEL_ID:-mikeinnyc/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16}
      - --revision=${MODEL_REVISION:-a47b0c6f0d756bc394c4cc629d5b0ded1acc7001}
      - --quantization=gptq
      - --dtype=float16
      - --max-model-len=${MAX_MODEL_LEN:-200704}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.965}
      - --kv-cache-dtype=fp8
      - --max-num-seqs=${MAX_NUM_SEQS:-4}
      - --max-num-batched-tokens=6656
      - --scheduler-reserve-full-isl
      - --watermark=0.0
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --served-model-name=${SERVED_MODEL_NAME:-Qwen3.8-27B}
      - '--speculative-config={"method":"mtp","num_speculative_tokens":${SPECULATIVE_TOKENS:-4}}'
      - --middleware=request_defaults.ChatDefaults
      - '--reasoning-config={"reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
      - '--override-generation-config={"max_new_tokens":16384}'
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - '--limit-mm-per-prompt={"image":1,"video":0}'
      - '--mm-processor-kwargs={"max_pixels":4194304}'
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 1200s
      retries: 5

volumes:
  huggingface-cache:
    external: true
    name: ${HF_CACHE_VOLUME:-vllm-huggingface-cache}
  b70-vllm-cache:
  b70-triton-cache:

networks:
  vllm-network:
    external: true
    name: ${VLLM_NETWORK:-vllm-network}
